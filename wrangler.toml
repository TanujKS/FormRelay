name = "form-relay"
main = "src/worker.ts"
compatibility_date = "2025-01-09"
preview_urls = true

# Custom domain will be configured in Cloudflare Dashboard
# Go to Workers & Pages → form-relay → Settings → Custom Domains
#
# Environments configured in this file:
# - default (top-level config): production-style deploy with DEBUG disabled
# - debug: deploy with `wrangler deploy --env debug` to enable DEBUG and observability
#
# Deploy commands:
# - Default environment: `wrangler deploy`
# - Specific environment: `wrangler deploy --env debug`

# Environment variables
# Required secrets (set via `wrangler secret put`):
# - MAILGUN_API_KEY
# - MAILGUN_DOMAIN (e.g., "mail.tanuj.xyz")
# - DISCORD_ERROR_WEBHOOK
#
# Optional, non-secret vars (set via `wrangler.toml` [vars] or dashboard env vars):
# - DEV_MODE (e.g., "true" to force all submissions to use defaultNotifyTo)
# - DEBUG (e.g., "true" to enable runtime debug logging)
#
# Form configurations are in repository files:
# - config/forms.json (form-specific settings)
# - config/defaults.json (default fallback settings)

[vars]
# Uncomment to enable dev mode in non-production environments
DEV_MODE = "false"
DEBUG = "false"

# Optional: bindings (currently commented out)
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[d1_databases]]
# binding = "FORMS_D1"
# database_name = "forms"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

[observability]
[observability.logs]
enabled = false
invocation_logs = false
[observability.traces]
enabled = false

[env.debug.vars]
DEV_MODE = "false"
DEBUG = "true"

[env.debug.observability]
enabled = true

[env.debug.observability.logs]
enabled = true
invocation_logs = true

[env.debug.observability.traces]
enabled = false

[assets]
directory = "./public"